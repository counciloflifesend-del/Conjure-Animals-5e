<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Beast Library - Conjurer's Ledger</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
  </head>
  <body data-page="library">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="index.html">Arcane Ledger</a>
        <nav class="nav" aria-label="Main navigation">
          <a class="active" href="library.html">Beast Library</a>
          <a href="index.html">Calculators</a>
          <a href="help.html">Help</a>
          <a href="about.html">About</a>
        </nav>
        <div class="top-actions">
          <button class="icon-button fountain-button" id="fountain-roll-button" type="button" title="Fun Fountain Dew Roll" aria-label="Fun Fountain Dew Roll">
            <svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v4M8 7h8M6 20h12M7 17h10M9 11c-3 1-4.5 3.4-4.5 6M15 11c3 1 4.5 3.4 4.5 6M12 8c-1.7 1.4-2.5 3.3-2.5 5.8M12 8c1.7 1.4 2.5 3.3 2.5 5.8" />
            </svg>
          </button>
          <a class="icon-link" href="settings.html" title="Open Settings" aria-label="Open Settings">
            <svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6ZM20 12l-2.1-.7a6.5 6.5 0 0 0-.6-1.4l1-2-2.3-2.2-1.9 1a7 7 0 0 0-1.5-.6L12 4H8.8l-.6 2.1a7 7 0 0 0-1.5.6l-1.9-1-2.3 2.2 1 2a6.5 6.5 0 0 0-.6 1.4L.8 12l.7 3.1 2.1.7c.2.5.4 1 .7 1.4l-1 2L5.6 21l1.9-1c.5.3 1 .5 1.5.6l.6 2.1h3.2l.6-2.1c.5-.1 1-.3 1.5-.6l1.9 1 2.3-2.2-1-2c.3-.4.5-.9.7-1.4l2.1-.7L20 12Z" />
            </svg>
          </a>
        </div>
      </header>

      <main class="container">
        <section class="page-header">
          <h1>Conjuration Compendium</h1>
          <p>A definitive index of beasts for arcane summoning rites. Select subjects to populate your combat ledger.</p>
        </section>

        <section class="panel panel-pad library-toolbar" aria-label="Beast filters">
          <div class="field">
            <label for="search-beasts">Search</label>
            <input id="search-beasts" type="search" placeholder="Search by beast name or trait...">
          </div>
          <div class="field">
            <label for="filter-cr">Challenge</label>
            <select id="filter-cr">
              <option value="">CR: All</option>
              <option value="1/4">CR 1/4</option>
              <option value="1/2">CR 1/2</option>
              <option value="1">CR 1</option>
              <option value="2">CR 2</option>
            </select>
          </div>
          <div class="field">
            <label for="filter-env">Environment</label>
            <select id="filter-env">
              <option value="">Environment: All</option>
              <option value="forest">Forest</option>
              <option value="grassland">Grassland</option>
              <option value="swamp">Swamp</option>
              <option value="underdark">Underdark</option>
            </select>
          </div>
        </section>

        <section class="library-grid" id="library-grid" aria-label="Beast cards"></section>
      </main>

      <footer class="footer">
        <div class="footer-inner">
          <strong class="brand">Conjurer's Ledger</strong>
          <span>Summons indexed for quick combat use.</span>
          <nav class="footer-links" aria-label="Footer navigation">
            <a href="#" data-toast="Library entries use practical SRD-style defaults.">Source</a>
            <a href="#" data-toast="Tip: import a beast, then tune the calculator manually.">Tip</a>
            <a href="#" data-toast="Support channel prepared.">Support</a>
          </nav>
        </div>
      </footer>
    </div>
  </body>
</html>
